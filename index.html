      .hero p {font-size:16px;line-height:1.7}
      .hero-image-wrap {aspect-ratio:1.35}

      .section {padding:69px 0}
      .section-header {margin-bottom:34px}
      .about-grid,.inner-about .about-grid,.contact-grid {grid-template-columns:1fr;gap:32px}
      .about-illustration {min-height:275px}
      .about-icon {width:155px;height:155px}
      .page-intro {padding:60px 0 48px}
      .inner-services {padding:34px 0 70px}
      .inner-about {padding:35px 0 72px}
      .contact-section {padding:35px 0 75px}
      .cta-section {padding:63px 0}
    }
    @media(max-width:480px) {
      .language-switch button {min-width:31px;padding:5px 7px}
      .services-grid,.inner-services .services-grid {grid-template-columns:1fr}
      .service-card {padding:26px}

      .hero-buttons,.cta-buttons {align-items:stretch}

      .field-row {grid-template-columns:1fr;gap:0}

      @keyframes visual-appear {from{opacity:.4;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    }
    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after {scroll-behavior:auto!important;transition:none!important;animation:none!important}
    }
  </style>
</head>

    const icons = {

      mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3 6 9 7 9-7"/></svg>',
      home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-8h6v8"/><path d="m17 4 2-2"/></svg>',
      office:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="1"/><path d="M9 21v-5h6v5M8 8h2m4 0h2M8 12h2m4 0h2"/></svg>',

      window:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M12 3v18M3 12h18M16.5 7l1-1M6.5 17l2-2"/></svg>',
      sparkle:'<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M29 5C29 19 19 29 5 29c14 0 24 10 24 24 0-14 10-24 24-24C39 29 29 19 29 5Z" fill="#10888C"/><path d="M49 3c0 8-5 13-13 13 8 0 13 5 13 13 0-8 5-13 13-13-8 0-13-5-13-13Z" fill="#7ACFC1"/><circle cx="51" cy="47" r="6" fill="#99DDD0"/></svg>',
      about:'<svg class="about-icon" viewBox="0 0 210 210" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="105" cy="105" r="87" fill="#fff" fill-opacity=".85"/><circle cx="105" cy="105" r="65" stroke="#A7DED3" stroke-width="2" stroke-dasharray="5 7"/><path d="M40 119c27 0 27-23 54-23s27 23 54 23 27-23 54-23" stroke="#0B868A" stroke-width="9" stroke-linecap="round"/><path d="M40 149c27 0 27-23 54-23s27 23 54 23 27-23 54-23" stroke="#7BCDC1" stroke-width="9" stroke-linecap="round"/><path d="M104 37c11 14 19 23 19 33a19 19 0 1 1-38 0c0-10 8-19 19-33Z" fill="#0B868A"/></svg>'
    };

    const sections=['home','services','about','contact'];
    const navEl=document.getElementById('navigation');
    const mainEl=document.getElementById('main');
    const footerEl=document.getElementById('footer');
    const menuBtn=document.getElementById('menu-toggle');
    const fiBtn=document.getElementById('fi-switch');
    const enBtn=document.getElementById('en-switch');
    let state={lang:'fi',page:'home'};

    function getUrl(lang=state.lang,page=state.page){return `#/${lang}/${page}`}
    function getRoute(){
      const match=location.hash.match(/^#\/(fi|en)(?:\/(home|services|about|contact))?\/?$/);
      if(match)return {lang:match[1],page:match[2]||'home'};
      let stored='fi';
      try {stored=localStorage.getItem('freshwave-language')==='en'?'en':'fi'}catch(_error){}
      return {lang:stored,page:'home'};
    }
    function setRoute(lang,page){
      if(!texts[lang]||!sections.includes(page))return;
      const url=getUrl(lang,page);
      if(location.hash!==url)history.pushState(null,'',url);
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    }
    function closeMenu(){
      navEl.classList.remove('open');
      menuBtn.setAttribute('aria-expanded','false');
      menuBtn.setAttribute('aria-label',texts[state.lang].menu);
    }
    function navLink(page,label,classes='nav-link'){
      const current=state.page===page?' aria-current="page"':'';
      return `<a class="${classes}" href="${getUrl(state.lang,page)}"${current}>${label}</a>`;
    }
    function pageIntro(title,desc){
      const t=texts[state.lang];
      return `<section class="page-intro"><div class="container"><div class="eyebrow">FreshWave TMI</div><h1>${title}</h1><p>${desc}</p></div></section>`;
    }
    function serviceCards(){
      const t=texts[state.lang];
      const iconNames=['home','office','move','window'];
      return `<div class="services-grid">${t.services.map((s,i)=>`<article class="service-card"><div class="service-icon">${icons[iconNames[i]]}</div><h3>${s.name}</h3><p>${s.desc}</p></article>`).join('')}</div>`;
    }
    function aboutSection(isInner=false){
      const t=texts[state.lang];
      const copy=t.about.map(p=>`<p>${p}</p>`).join('');
      return `<section class="section section-white ${isInner?'inner-about':''}"><div class="container about-grid"><div class="about-illustration">${icons.about}</div><div class="about-copy">${isInner?'':`<div class="eyebrow">${t.aboutTitle}</div><h2>${t.aboutSubtitle}</h2>`}<div class="prose">${copy}</div></div></div></section>`;
    }
    function ctaSection(){
      const t=texts[state.lang];
      return `<section class="cta-section"><div class="container cta-inner"><h2>${t.ctaTitle}</h2><p>${t.ctaDesc}</p><div class="cta-buttons"><a class="button button-light" href="${getUrl(state.lang,'contact')}">${t.quote} ${icons.arrow}</a><a class="button button-glass" href="tel:${PHONE}">${icons.phone}${t.call}</a></div></div></section>`;
    }
    function homePage(){
      const t=texts[state.lang];
      return `<section class="hero"><div class="container hero-grid"><div class="hero-content"><div class="eyebrow">${t.location}</div><h1>${t.heroTitle}</h1><p>${t.heroDesc}</p><div class="hero-buttons"><a class="button button-primary" href="${getUrl(state.lang,'contact')}">${t.quote} ${icons.arrow}</a><a class="button button-outline" href="${getUrl(state.lang,'services')}">${t.learn}</a></div></div><div class="hero-visual"><div class="hero-image-wrap">${heroFallback}<img src="${HERO_IMAGE}" alt="${state.lang==='fi'?'Raikas ja valoisa koti':'A fresh, bright and clean home'}" loading="eager" decoding="async" fetchpriority="high" referrerpolicy="no-referrer" onerror="this.classList.add('image-failed')"></div><div class="hero-bottom-accent">${icons.sparkle}</div></div></div></section><section class="section section-white"><div class="container"><div class="section-header"><h2>${t.servicesTitle}</h2><p>${t.servicesDesc}</p></div>${serviceCards()}</div></section>${aboutSection()}${ctaSection()}`;
    }
    function servicesPage(){const t=texts[state.lang];return `${pageIntro(t.servicesTitle,t.servicesDesc)}<section class="inner-services"><div class="container">${serviceCards()}</div></section>${ctaSection()}`}
    function aboutPage(){const t=texts[state.lang];return `${pageIntro(t.aboutTitle,t.aboutSubtitle)}${aboutSection(true)}${ctaSection()}`}
    function contactPage(){
      const t=texts[state.lang],f=t.form;
      return `${pageIntro(t.contactTitle,t.contactDesc)}<section class="contact-section"><div class="container contact-grid"><aside class="contact-info"><h2>${t.contactInfoTitle}</h2><p>${t.contactDesc}</p><a class="contact-line" href="tel:${PHONE}">${icons.phone}<span>${DISPLAY_PHONE}</span></a><a class="contact-line" href="mailto:${EMAIL}">${icons.mail}<span>${EMAIL}</span></a></aside><form class="contact-form" id="contact-form"><div class="field-row"><div class="field"><label for="contact-name">${f.name}</label><input id="contact-name" name="name" autocomplete="name" required maxlength="100"></div><div class="field"><label for="contact-email">${f.email}</label><input id="contact-email" name="email" type="email" autocomplete="email" required maxlength="200"></div></div><div class="field"><label for="contact-phone">${f.phone}</label><input id="contact-phone" name="phone" type="tel" autocomplete="tel" maxlength="60"></div><div class="field"><label for="contact-message">${f.message}</label><textarea id="contact-message" name="message" required maxlength="6000"></textarea></div><button class="button button-primary" type="submit">${f.submit} ${icons.arrow}</button><p class="form-status" id="form-status" role="status" aria-live="polite" hidden></p></form></div></section>`;
    }
    function bindForm(){
      const form=document.getElementById('contact-form');
      if(!form)return;
      form.addEventListener('submit',event=>{
        event.preventDefault();
        if(!form.reportValidity())return;
        const f=texts[state.lang].form;
        const d=new FormData(form);
        const body=`${f.nameLabel}: ${d.get('name')}\n${f.emailLabel}: ${d.get('email')}\n${f.phoneLabel}: ${d.get('phone')||'-'}\n\n${f.messageLabel}:\n${d.get('message')}`;
        const link=`mailto:${EMAIL}?subject=${encodeURIComponent(f.subject)}&body=${encodeURIComponent(body)}`;
        const status=document.getElementById('form-status');
        status.hidden=false;
        status.textContent=f.status;
        window.location.href=link;
      });
    }
    function render(){
      state=getRoute();
      const t=texts[state.lang];
      document.documentElement.lang=state.lang;
      document.title=t.titles[state.page];
      document.querySelector('meta[name="description"]').setAttribute('content',t.meta);
      try {localStorage.setItem('freshwave-language',state.lang)}catch(_error){}
      document.getElementById('logo').href=getUrl(state.lang,'home');
      navEl.setAttribute('aria-label',state.lang==='fi'?'Päävalikko':'Main navigation');
      navEl.innerHTML=sections.map(page=>navLink(page,t.nav[page])).join('');
      fiBtn.classList.toggle('active',state.lang==='fi');
      enBtn.classList.toggle('active',state.lang==='en');
      fiBtn.setAttribute('aria-pressed',String(state.lang==='fi'));
      enBtn.setAttribute('aria-pressed',String(state.lang==='en'));
      closeMenu();
      const pages={home:homePage,services:servicesPage,about:aboutPage,contact:contactPage};
      mainEl.innerHTML=pages[state.page]();
      footerEl.innerHTML=`<div class="container footer-inner"><div><a class="footer-brand" href="${getUrl(state.lang,'home')}">FreshWave TMI</a><p class="footer-meta">${t.id}: 3440383-6</p></div><div class="footer-copy">© 2026 FreshWave TMI. ${t.rights}</div></div>`;
      bindForm();
      window.scrollTo({top:0,behavior:'instant'});
    }
    document.querySelector('.skip-link').addEventListener('click', event => {
      event.preventDefault();
      mainEl.focus({preventScroll:true});
      mainEl.scrollIntoView({behavior:'smooth'});
    });
    fiBtn.addEventListener('click',()=>setRoute('fi',state.page));
    enBtn.addEventListener('click',()=>setRoute('en',state.page));
    menuBtn.addEventListener('click',()=>{
      const open=navEl.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded',String(open));
      menuBtn.setAttribute('aria-label',open?texts[state.lang].closeMenu:texts[state.lang].menu);
    });
    navEl.addEventListener('click',event=>{if(event.target.closest('a'))closeMenu()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu()});
    window.addEventListener('hashchange',render);
    window.addEventListener('popstate',render);
    render();
  })();
  </script>
